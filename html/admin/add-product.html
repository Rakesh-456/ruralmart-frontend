<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product — RuralMart Admin</title>
<link rel="stylesheet" href="../../css/styles.css">
</head>
<body>

<div id="site-header"></div>

<div class="page">
  <div class="container" style="max-width:760px;">

    <div class="page-header">
      <div class="eyebrow">Admin</div>
      <h1>Add product</h1>
      <p>Add a new product to your shop's catalog.</p>
    </div>

    <div class="card card-pad">
      <div id="addProductAlert" class="alert"></div>
      <form id="addProductForm" novalidate>
        <div class="form-grid-2">
          <div class="form-group">
            <label for="name">Product name</label>
            <input type="text" id="name" placeholder="Fresh Apples" required>
            <div class="field-error-text" data-for="name"></div>
          </div>
          <div class="form-group">
            <label for="brand">Brand</label>
            <input type="text" id="brand" placeholder="Farm Fresh" required>
            <div class="field-error-text" data-for="brand"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" placeholder="Short description of the product" required></textarea>
          <div class="field-error-text" data-for="description"></div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required></select>
            <div class="field-error-text" data-for="category"></div>
          </div>
          <div class="form-group">
            <label for="unit">Unit</label>
            <input type="text" id="unit" placeholder="kg, litre, piece..." required>
            <div class="field-error-text" data-for="unit"></div>
          </div>
          <div class="form-group">
            <label for="price">Price (₹)</label>
            <input type="number" id="price" min="1" step="0.01" placeholder="100" required>
            <div class="field-error-text" data-for="price"></div>
          </div>
          <div class="form-group">
            <label for="stock">Stock</label>
            <input type="number" id="stock" min="0" placeholder="25" required>
            <div class="field-error-text" data-for="stock"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="imageUrl">Image URL</label>
          <input type="text" id="imageUrl" placeholder="https://...">
          <div class="field-error-text" data-for="imageUrl"></div>
        </div>

        <div class="form-actions">
          <button type="submit" id="addProductSubmit" class="btn btn-primary">Add product</button>
          <a class="btn btn-outline" href="products.html">Cancel</a>
        </div>
      </form>
    </div>

  </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/nav.js"></script>
<script src="../../js/product.js"></script>
</body>
</html>
