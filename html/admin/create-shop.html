<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Shop — RuralMart Admin</title>
<link rel="stylesheet" href="../../css/styles.css">
</head>
<body>

<div id="site-header"></div>

<div class="page">
  <div class="container" style="max-width:600px;">

    <div class="page-header">
      <div class="eyebrow">Admin</div>
      <h1>Set up your shop</h1>
      <p>Create your shop profile before adding products. You can only create one shop per account.</p>
    </div>

    <div class="card card-pad">
      <div id="createShopAlert" class="alert"></div>
      <form id="createShopForm" novalidate>
        <div class="form-group">
          <label for="shopName">Shop name</label>
          <input type="text" id="shopName" placeholder="Green Valley Grocers" required>
          <div class="field-error-text" data-for="shopName"></div>
        </div>
        <div class="form-group">
          <label for="phoneNumber">Phone number</label>
          <input type="tel" id="phoneNumber" placeholder="9876543210" required>
          <div class="field-error-text" data-for="phoneNumber"></div>
        </div>
        <div class="form-group">
          <label for="address">Address</label>
          <input type="text" id="address" placeholder="Shop address" required>
          <div class="field-error-text" data-for="address"></div>
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" placeholder="A short description of your shop" required></textarea>
          <div class="field-error-text" data-for="description"></div>
        </div>
        <div class="form-actions">
          <button type="submit" id="createShopSubmit" class="btn btn-primary btn-block">Create shop</button>
        </div>
      </form>
    </div>

  </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/nav.js"></script>
<script src="../../js/shop.js"></script>
</body>
</html>
