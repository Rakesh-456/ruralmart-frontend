<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — RuralMart Admin</title>
<link rel="stylesheet" href="../../css/styles.css">
</head>
<body>

<div id="site-header"></div>

<div class="page">
  <div class="container">

    <div class="page-header flex justify-between items-center" style="flex-wrap:wrap;gap:12px;">
      <div>
        <div class="eyebrow">Admin</div>
        <h1 class="mb-0">Products</h1>
      </div>
      <a class="btn btn-primary" href="add-product.html">+ Add Product</a>
    </div>

    <div class="toolbar">
      <div class="search-input">
        <input type="text" id="searchInput" placeholder="Search by name or brand...">
      </div>
      <select id="categoryFilter"><option value="">All categories</option></select>
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="ACTIVE">Active</option>
        <option value="OUT_OF_STOCK">Out of stock</option>
        <option value="INACTIVE">Inactive</option>
        <option value="DISCONTINUED">Discontinued</option>
      </select>
      <select id="sortSelect">
        <option value="">Sort by</option>
        <option value="name-asc">Name (A–Z)</option>
        <option value="price-asc">Price (Low to High)</option>
        <option value="price-desc">Price (High to Low)</option>
        <option value="stock-asc">Stock (Low to High)</option>
      </select>
      <select id="pageSizeSelect" style="min-width:110px;">
        <option value="10">10 / page</option>
        <option value="20">20 / page</option>
        <option value="50">50 / page</option>
      </select>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Product</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="productTable"></tbody>
      </table>
    </div>

    <div class="toolbar" id="paginationBar" style="justify-content:center;margin-top:20px;">
      <button class="btn btn-outline btn-sm" id="prevPageBtn" type="button">← Previous</button>
      <span class="text-muted" id="pageIndicator" style="font-size:.85rem;font-weight:600;">Page 1 of 1</span>
      <button class="btn btn-outline btn-sm" id="nextPageBtn" type="button">Next →</button>
    </div>

  </div>
</div>

<!-- Delete confirmation modal -->
<div class="modal-backdrop" id="deleteModalBackdrop">
  <div class="modal">
    <h3>Delete this product?</h3>
    <p>This can't be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-outline" id="cancelDeleteBtn" type="button">Cancel</button>
      <button class="btn btn-danger" id="confirmDeleteBtn" type="button">Delete product</button>
    </div>
  </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/nav.js"></script>
<script src="../../js/product.js"></script>
</body>
</html>
