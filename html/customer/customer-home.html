<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RuralMart — Shop groceries</title>
<link rel="stylesheet" href="../../css/styles.css">
</head>
<body>

<div id="site-header"></div>

<div class="page">
  <div class="container">

    <div class="hero">
      <h1>Fresh groceries, delivered from local shops.</h1>
      <p>Browse everything available near you — search by name or explore by category.</p>
      <div class="hero-search">
        <input type="text" id="heroSearchInput" placeholder="Search for apples, rice, milk...">
        <button class="btn btn-accent" id="heroSearchBtn" type="button">Search</button>
      </div>
    </div>

    <h2>Categories</h2>
    <div class="category-row" id="categoryRow"></div>

    <div id="productSection">
      <div class="toolbar">
        <h2 class="mb-0">Products</h2>
        <div class="toolbar-spacer"></div>
        <select id="sortSelect">
          <option value="">Sort by</option>
          <option value="name-asc">Name (A–Z)</option>
          <option value="price-asc">Price (Low to High)</option>
          <option value="price-desc">Price (High to Low)</option>
        </select>
      </div>

      <div id="productContainer" class="product-grid"></div>

      <div id="paginationBar" style="margin-top:8px;"></div>
    </div>

  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <span>🌾 RuralMart</span>
    <span>Checkout &amp; payments coming soon.</span>
  </div>
</footer>

<!-- Product details modal -->
<div class="modal-backdrop" id="productModalBackdrop">
  <div class="modal" style="max-width:520px;">
    <div class="flex justify-between items-center">
      <h3 class="mb-0">Product details</h3>
      <button class="btn btn-ghost btn-sm" id="modalClose" type="button">✕</button>
    </div>
    <div id="modalBody" style="margin-top:10px;"></div>
  </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/nav.js"></script>
<script src="../../js/toast.js"></script>
<script src="../../js/customer.js"></script>
</body>
</html>
