<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile | RuralMart</title>

    <link rel="stylesheet"
          href="../CSS/styles.css">

</head>

<body>

    <h2>🌾 RuralMart</h2>

    <button onclick="window.location.href='dashboard.html'">
        Dashboard
    </button>

    <button onclick="logout()">
        Logout
    </button>

    <hr>

    <h1>My Profile</h1>

    <form id="profileForm">

        <label>
            Full Name
        </label>

        <br>

        <input
            type="text"
            id="fullName"
            required>

        <br><br>


        <label>
            Email
        </label>

        <br>

        <input
            type="email"
            id="email"
            disabled>

        <br><br>


        <label>
            Phone Number
        </label>

        <br>

        <input
            type="text"
            id="phoneNumber"
            required>

        <br><br>


        <label>
            Role
        </label>

        <br>

        <input
            type="text"
            id="role"
            disabled>

        <br><br>


        <button type="submit">
            Update Profile
        </button>

    </form>

    <p id="message"></p>


    <hr>

    <h2>Change Password</h2>

    <form id="passwordForm">

        <label>
            Current Password
        </label>

        <br>

        <input
            type="password"
            id="currentPassword"
            required>

        <br><br>


        <label>
            New Password
        </label>

        <br>

        <input
            type="password"
            id="newPassword"
            required>

        <br><br>


        <label>
            Confirm New Password
        </label>

        <br>

        <input
            type="password"
            id="confirmPassword"
            required>

        <br><br>


        <button type="submit">
            Change Password
        </button>

    </form>

    <p id="passwordMessage"></p>


    <!-- Existing API utility -->
    <script src="../js/api.js"></script>

    <!-- Existing logout -->
    <script src="../js/logout.js"></script>

    <!-- New profile JS -->
    <script src="../js/profile.js"></script>

</body>

</html>
