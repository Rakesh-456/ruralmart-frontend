<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Register</title>

<link rel="stylesheet" href="../css/styles.css">

</head>

<body>

<div class="container">

<div class="card">

<h1>🌾 RuralMart</h1>

<h2>Create Account</h2>

<form id="registerForm">

<input
type="text"
id="fullName"
placeholder="Full Name"
required>

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="text"
id="phoneNumber"
placeholder="Phone Number"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">

Register

</button>

</form>

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

<div id="message"
class="message">

</div>

</div>

</div>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
</body>

</html>
