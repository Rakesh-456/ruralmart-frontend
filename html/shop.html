<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Shop</title>

    <link rel="stylesheet"
          href="../CSS/styles.css">

</head>

<body>

<h1>My Shop</h1>

<form id="shopForm">

    <label>Shop Name</label><br>

    <input
            type="text"
            id="shopName"
            required>

    <br><br>

    <label>Phone Number</label><br>

    <input
            type="text"
            id="phoneNumber"
            required>

    <br><br>

    <label>Address</label><br>

    <textarea
            id="address"
            rows="4"
            required></textarea>

    <br><br>

    <label>Description</label><br>

    <textarea
            id="description"
            rows="4"></textarea>

    <br><br>

    <button type="submit">

        Update Shop

    </button>

    <button
            type="button"
            onclick="window.location.href='dashboard.html'">

        Back

    </button>

    <button onclick="logout()">
    Logout
    </button>

</form>

<script src="../js/api.js"></script>
<script src="../js/shop.js"></script>
<script src="../js/logout.js"></script>

</body>

</html>
