<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard | RuralMart</title>

    <link rel="stylesheet"
          href="../CSS/styles.css">

</head>

<body>

    <!-- =========================
         TOP NAVIGATION
         ========================= -->

    <header class="topbar">

        <a href="dashboard.html" class="brand">

            <div class="brand-logo">
                🌾
            </div>

            <span class="brand-name">
                RuralMart
            </span>

        </a>


        <nav class="nav-links">

            <a href="dashboard.html"
               class="active">
                Dashboard
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="shop.html">
                My Shop
            </a>

        </nav>


        <!-- USER PROFILE -->

        <div class="user-area">

            <div class="user-info">

                <span
                    class="user-name"
                    id="userName">
                    User
                </span>

                <span
                    class="user-role"
                    id="userRole">
                    Customer
                </span>

            </div>


            <a href="profile.html">

                <div
                    class="user-avatar"
                    id="userAvatar">
                    U
                </div>

            </a>

        </div>

    </header>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main class="main-content">


        <div class="page-header">

            <div>

                <h1 class="page-title">
                    Dashboard
                </h1>

                <p class="page-subtitle"
                   id="welcomeMessage">
                    Welcome back 👋
                </p>

            </div>


            <button
                id="logoutBtn"
                class="logout-btn">

                Logout

            </button>

        </div>


        <!-- =========================
             STATISTICS
             ========================= -->

        <div class="dashboard-grid">


            <div class="card">

                <h3>
                    Total Products
                </h3>

                <h2 id="totalProducts">
                    0
                </h2>

            </div>


            <div class="card">

                <h3>
                    Active Products
                </h3>

                <h2 id="activeProducts">
                    0
                </h2>

            </div>


            <div class="card">

                <h3>
                    Inactive Products
                </h3>

                <h2 id="inactiveProducts">
                    0
                </h2>

            </div>


            <div class="card">

                <h3>
                    Out Of Stock
                </h3>

                <h2 id="outOfStockProducts">
                    0
                </h2>

            </div>

        </div>


        <!-- =========================
             QUICK ACTIONS
             ========================= -->

        <div class="actions">


            <a href="products.html"
               class="action-card">

                <div class="action-card-icon">
                    📦
                </div>

                <h3>
                    My Products
                </h3>

                <p>
                    View and manage your products
                </p>

            </a>


            <a href="add-product.html"
               class="action-card">

                <div class="action-card-icon">
                    ➕
                </div>

                <h3>
                    Add Product
                </h3>

                <p>
                    Add a new product to your shop
                </p>

            </a>


            <a href="shop.html"
               class="action-card">

                <div class="action-card-icon">
                    🏪
                </div>

                <h3>
                    My Shop
                </h3>

                <p>
                    Manage your shop information
                </p>

            </a>


        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="../js/api.js"></script>

    <script src="../js/auth.js"></script>

    <script src="../js/logout.js"></script>

    <script src="../js/dashboard.js"></script>

</body>

</html>
