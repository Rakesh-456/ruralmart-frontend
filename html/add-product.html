<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Product</title>

    <link rel="stylesheet"
          href="../CSS/styles.css">

</head>

<body>

    <header class="top-header">

        <div class="brand">
            🌾 RuralMart
        </div>

        <button id="logoutBtn" class="logout-btn">
            Logout
        </button>

    </header>


    <main class="add-product-page">

        <div class="add-product-card">

            <h1>Add Product</h1>

            <p class="form-subtitle">
                Add a new product to your shop
            </p>


            <form id="addProductForm" class="add-product-form">

                <!-- Product Name -->
                <div class="form-group">

                    <label for="name">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter product name"
                        required>

                </div>


                <!-- Brand -->
                <div class="form-group">

                    <label for="brand">
                        Brand
                    </label>

                    <input
                        type="text"
                        id="brand"
                        placeholder="Enter brand"
                        required>

                </div>


                <!-- Description -->
                <div class="form-group full-width">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Enter product description"
                        required></textarea>

                </div>


                <!-- Category -->
                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="GROCERY">
                            Grocery
                        </option>

                        <option value="DAIRY">
                            Dairy
                        </option>

                        <option value="VEGETABLES">
                            Vegetables
                        </option>

                        <option value="FRUITS">
                            Fruits
                        </option>

                        <option value="SNACKS">
                            Snacks
                        </option>

                        <option value="BEVERAGES">
                            Beverages
                        </option>

                        <option value="PERSONAL_CARE">
                            Personal Care
                        </option>

                        <option value="HOUSEHOLD">
                            Household
                        </option>

                    </select>

                </div>


                <!-- Price -->
                <div class="form-group">

                    <label for="price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="price"
                        placeholder="Enter price"
                        min="1"
                        step="0.01"
                        required>

                </div>


                <!-- Stock -->
                <div class="form-group">

                    <label for="stock">
                        Stock
                    </label>

                    <input
                        type="number"
                        id="stock"
                        placeholder="Enter stock"
                        min="0"
                        required>

                </div>


                <!-- Unit -->
                <div class="form-group">

                    <label for="unit">
                        Unit
                    </label>

                    <input
                        type="text"
                        id="unit"
                        placeholder="kg, litre, piece..."
                        required>

                </div>


                <!-- Image URL -->
                <div class="form-group full-width">

                    <label for="imageUrl">
                        Image URL
                    </label>

                    <input
                        type="text"
                        id="imageUrl"
                        placeholder="Enter image URL"
                        required>

                </div>


                <!-- Submit -->
                <div class="form-actions">

                    <button
                        type="submit"
                        class="add-product-btn">

                        Add Product

                    </button>

                    <button
                        type="button"
                        class="cancel-btn"
                        onclick="window.location.href='products.html'">

                        Cancel

                    </button>

                </div>

            </form>

        </div>

    </main>


    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/product.js"></script>
    <script src="../js/logout.js"></script>

</body>

</html>
