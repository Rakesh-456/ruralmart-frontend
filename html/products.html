<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Products</title>

    <link rel="stylesheet"
          href="../CSS/styles.css">

</head>

<body>

<h1>My Products</h1>

<br>

<input
    type="text"
    id="searchKeyword"
    placeholder="Search Products">

<button onclick="searchProducts()">
    Search
</button>

<button onclick="clearSearch()">
    Clear
</button>

<button onclick="window.location.href='add-product.html'">
    Add Product
</button>

<button onclick="logout()">
    Logout
</button>

<br><br>

<table border="1" width="100%">

    <thead>

        <tr>

            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Status</th>
            <th>Edit</th>
            <th>Delete</th>

        </tr>

    </thead>

    <tbody id="productTable">

    </tbody>

</table>

<br>

<button id="previousBtn"
        onclick="previousPage()">
    Previous
</button>

<span id="pageNumber">
    1
</span>

<button id="nextBtn"
        onclick="nextPage()">
    Next
</button>

<button onclick="logout()">
    Logout
</button>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/product.js"></script>s
<script src="../js/logout.js"></script>

</body>
</html>
