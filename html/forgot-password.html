<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — RuralMart</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="brand-mark">🌾</span> RuralMart</a>
  </div>
</header>

<div class="auth-shell">
  <div class="card card-pad auth-card">
    <h1>Reset your password</h1>
    <p class="auth-sub" id="stepSubtitle">Enter your registered email to get a reset code.</p>

    <!-- STEP 1: email -->
    <div id="emailStep">
      <div id="requestAlert" class="alert"></div>
      <form id="requestOtpForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
          <div class="field-error-text" data-for="email"></div>
        </div>
        <button type="submit" id="requestOtpSubmit" class="btn btn-primary btn-block">Send reset code</button>
      </form>
    </div>

    <!-- STEP 2: OTP + new password (hidden until requested) -->
    <div id="resetStep" style="display:none;">
      <div class="coming-soon" style="margin-bottom:16px;">
        <span>📧</span>
        <span>If <strong id="otpEmailDisplay"></strong> has an account, a code was emailed to it. <button type="button" class="btn btn-ghost btn-sm" id="changeEmailBtn" style="padding:0 4px;text-decoration:underline;">Change email</button></span>
      </div>

      <div id="resetAlert" class="alert"></div>

      <form id="resetForm" novalidate>
        <div class="form-group">
          <label for="otp">6-digit code</label>
          <input type="text" id="otp" inputmode="numeric" maxlength="6" placeholder="483921" required>
          <div class="field-error-text" data-for="otp"></div>
          <div class="form-hint">
            Expires 5 minutes after it was sent. <span id="resendWrap">Didn't get it? <button type="button" id="resendOtpBtn" class="btn btn-ghost btn-sm" style="padding:0 4px;text-decoration:underline;">Resend</button></span>
          </div>
        </div>
        <div class="form-group">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" placeholder="At least 8 characters" required>
          <div class="field-error-text" data-for="newPassword"></div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter new password" required>
          <div class="field-error-text" data-for="confirmPassword"></div>
        </div>
        <button type="submit" id="resetSubmit" class="btn btn-primary btn-block">Reset password</button>
      </form>
    </div>

    <p class="auth-foot">Remembered it? <a href="login.html">Back to login</a></p>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/forgot-password.js"></script>
</body>
</html>
