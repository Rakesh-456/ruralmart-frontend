<!DOCTYPE html>
<html lang="en">

<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet" href="../css/styles.css">

</head>

<body>

<div class="container">

<div class="card">

<h1>🌾 RuralMart</h1>

<h2>Login</h2>

<form id="loginForm">

type="email"
id="email"

Login

</button>

</form>

<p>

Don't have an account?

Register

</a>

</p>

<div id="message"
class="message">

</div>

</div>

</div>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>

</body>

</html>
