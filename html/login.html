<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — RuralMart</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="brand-mark">🌾</span> RuralMart</a>
  </div>
</header>

<div class="auth-shell">
  <div class="card card-pad auth-card">
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to your RuralMart account.</p>

    <div id="loginAlert" class="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
        <div class="field-error-text" data-for="email"></div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" required>
        <div class="field-error-text" data-for="password"></div>
      </div>
      <button type="submit" id="loginSubmit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <p class="auth-foot">Don't have an account? <a href="register.html">Register</a></p>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
